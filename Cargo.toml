[workspace]
members = [".", "crt", "cli"]

[package]
name = "crtty"
version = "0.1.3"
edition = "2021"
description = "Post-processing shader framework for OpenGL apps via LD_PRELOAD"
license = "MIT"
readme = "README.md"
repository = "https://github.com/kosa12/CRTty"
homepage = "https://github.com/kosa12/CRTty"
keywords = ["crt", "kitty", "terminal", "opengl", "postprocessing"]
categories = ["graphics", "rendering"]
exclude = [
    "assets/",
    ".github/",
    "PKGBUILD",
    "flake.nix"
]

[lib]
name = "crtty"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
strip = "symbols"

[dependencies]
libc = "0.2"
